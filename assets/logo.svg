<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>AhPah Video Pro</title>
  <defs>
    <linearGradient id="ahpah-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ahpah-bg)"/>
  <!-- play triangle -->
  <path d="M172 150 L348 256 L172 362 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="28" stroke-linejoin="round"/>
  <!-- timeline: track and progress -->
  <rect x="112" y="398" width="288" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.32"/>
  <rect x="112" y="398" width="184" height="18" rx="9" fill="#22D3EE"/>
  <!-- playhead -->
  <rect x="290" y="386" width="10" height="42" rx="5" fill="#FFFFFF"/>
</svg>
